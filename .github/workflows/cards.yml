name: Refresh profile cards

on:
  schedule:
    - cron: "17 2 * * *"   # daily, 02:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "fonts/**", "assets/**"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools pillow

      - name: Refresh contribution data
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_data.py

      - name: Render cards
        run: python scripts/build_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards README.md
          git diff --cached --quiet || (git commit -m "chore: refresh profile cards" && git push)
